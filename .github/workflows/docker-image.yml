name: Publish Container Image to Docker Hub

on:
  push:
    branches:
      - develop
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '21'

      - name: Download Eclipse Temurin JDK 24
        run: |
          wget -O openjdk24.tar.gz $(curl -sL https://api.github.com/repos/adoptium/temurin24-binaries/releases/latest | grep browser_download_url | grep linux_x64_bin.tar.gz | cut -d '"' -f 4)
          tar -xzf openjdk24.tar.gz
          JAVA_DIR=$(tar -tf openjdk24.tar.gz | head -1 | cut -f1 -d"/")
          echo "JAVA_HOME=$PWD/$JAVA_DIR" >> $GITHUB_ENV
          echo "$PWD/$JAVA_DIR/bin" >> $GITHUB_PATH

      - name: Java Version Check
        run: java -version

      - name: Maven Version Check
        run: mvn -v

      - name: Maven Clean and Package
        run: mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sanitize Git Branch Name
        id: sanitize_branch
        run: echo "BRANCH_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t benferenchak/ramsey-worker:${{ env.BRANCH_NAME }} \
            --push .
